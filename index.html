<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ZAVORA | ثبت نیاز</title>

    <meta
        name="description"
        content="ZAVORA - Afghanistan Needs & Services Marketplace"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <!-- Header -->

    <header class="site-header">

        <div class="header-container">

            <div class="logo">
                ZAVORA
            </div>

            <div class="logo-subtitle">
                نیازها و خدمات افغانستان
            </div>

        </div>

    </header>


    <!-- Main -->

    <main class="main-container">


        <!-- Need Section -->

        <section class="card need-card">

            <div class="section-header">

                <h1>
                    ثبت نیاز جدید
                </h1>

                <p>
                    اطلاعات مورد نیاز خود را وارد کنید.
                </p>

            </div>


            <form id="needForm">


                <!-- Title -->

                <div class="form-group">

                    <label for="title">
                        عنوان نیاز
                    </label>

                    <input
                        type="text"
                        id="title"
                        name="title"
                        placeholder="مثلاً نیاز به تعمیر موتر"
                        maxlength="150"
                        required
                    >

                </div>


                <!-- Description -->

                <div class="form-group">

                    <label for="description">
                        توضیحات
                    </label>

                    <textarea
                        id="description"
                        name="description"
                        rows="5"
                        maxlength="2000"
                        placeholder="نیاز خود را به‌صورت کامل توضیح دهید..."
                    ></textarea>

                </div>


                <!-- Phone -->

                <div class="form-group phone-group">

                    <label for="contactPhone">
                        شماره تلفن
                    </label>

                    <input
                        type="tel"
                        id="contactPhone"
                        name="contact_phone"
                        inputmode="tel"
                        autocomplete="tel"
                        placeholder="0700000000"
                        maxlength="13"
                        required
                    >

                    <small>
                        شماره تلفن افغانستان را وارد کنید.
                    </small>

                </div>


                <!-- Category -->

                <div class="form-group">

                    <label for="category">
                        دسته‌بندی
                    </label>

                    <select
                        id="category"
                        name="category"
                        required
                    >

                        <option value="">
                            در حال بارگذاری...
                        </option>

                    </select>

                </div>


                <!-- Subcategory -->

                <div class="form-group">

                    <label for="subcategory">
                        زیردسته
                    </label>

                    <select
                        id="subcategory"
                        name="subcategory"
                        disabled
                        required
                    >

                        <option value="">
                            ابتدا دسته‌بندی را انتخاب کنید
                        </option>

                    </select>

                </div>


                <!-- Province -->

                <div class="form-group">

                    <label for="location">
                        ولایت
                    </label>

                    <select
                        id="location"
                        name="location"
                        required
                    >

                        <option value="">
                            در حال بارگذاری...
                        </option>

                    </select>

                </div>


                <!-- Message -->

                <div
                    id="formMessage"
                    class="form-message"
                ></div>


                <!-- Submit -->

                <button
                    type="submit"
                    class="btn btn-primary btn-submit"
                >
                    ثبت نیاز
                </button>


            </form>

        </section>


        <!-- Authentication -->

        <section class="card auth-card">

            <h2>
                ورود به ZAVORA
            </h2>

            <p class="section-description">
                برای ثبت نیاز، وارد حساب کاربری شوید.
            </p>


            <form id="authForm">


                <div class="form-group">

                    <label for="authEmail">
                        ایمیل
                    </label>

                    <input
                        type="email"
                        id="authEmail"
                        placeholder="example@email.com"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="authPassword">
                        رمز عبور
                    </label>

                    <input
                        type="password"
                        id="authPassword"
                        placeholder="رمز عبور"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <div class="auth-buttons">

                    <button
                        type="submit"
                        id="loginButton"
                        class="btn btn-primary"
                    >
                        ورود
                    </button>


                    <button
                        type="button"
                        id="registerButton"
                        class="btn btn-secondary"
                    >
                        ساخت حساب جدید
                    </button>


                    <button
                        type="button"
                        id="logoutButton"
                        class="btn btn-danger"
                        style="display:none;"
                    >
                        خروج
                    </button>

                </div>


                <div
                    id="authMessage"
                    class="form-message"
                ></div>

            </form>

        </section>

    </main>


    <!-- Footer -->

    <footer class="site-footer">

        <p>
            © 2026 ZAVORA — تمام حقوق محفوظ است.
        </p>

    </footer>


    <!-- Supabase -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>

    <script src="supabase.js"></script>

    <script src="app.js"></script>

</body>

</html>
